# Local dev infrastructure for the AAS monorepo.
# You run the apps on the host (`npm run dev`); this file only runs the
# services they depend on (database + a fake mail server).
#
# Bring it up from the repo root:   npm run docker:up
# Stop it:                          npm run docker:down
# Wipe the database volume:         npm run docker:reset
#
# `${VAR:-default}` means: use VAR from the --env-file if set, else the default.
# The npm scripts pass  --env-file apps/api/.env.development.local  so your real
# DB credentials flow in; the defaults keep `docker compose down` working even
# without that file.

name: aas

services:
  postgres:
    image: postgres:16-alpine # pin a major version; never rely on :latest
    container_name: aas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-aas}
    ports:
      # host:container — DATABASE_PORT is what your app connects to on localhost
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume => data survives restarts
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-aas}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server so you can test the transactional emails without a real
  # provider. SMTP on 1025, web inbox UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: aas-mailpit
    restart: unless-stopped
    ports:
      - '${MAIL_SMTP_PORT:-1025}:1025'
      - '${MAIL_UI_PORT:-8025}:8025'

volumes:
  pgdata:
