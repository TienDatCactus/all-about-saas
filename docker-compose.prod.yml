# Production stack for a single VPS.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the dev docker-compose.yml that matter:
#   - Postgres is NOT published to the host. Only caddy has published ports.
#   - Schema comes from committed migrations via the one-shot `migrate` service,
#     never from synchronize.
#   - Every service has a healthcheck and restart: unless-stopped.

name: aas-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — the database is reachable only on the internal network.
    networks: [internal]
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations, then exits. `depends_on: service_completed_successfully`
  # on the api means the app never starts against an un-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    # The image has no dev deps (no ts-node), so the CLI runs against the
    # COMPILED data-source. Its globs are __dirname-relative and match .js too,
    # so it finds dist/database/migrations/*.js here.
    command:
      [
        'node',
        '/app/node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/common/config/data-source.js',
      ]
    working_dir: /app/apps/api
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL for the CORS allowlist}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: lax
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness, not liveness: this one fails when the DB is unreachable.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time — Vite inlines import.meta.env.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks: [internal]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # /data holds the ACME account + certificates. Losing it means re-issuing
      # on every restart, which hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    networks: [internal]
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge

# Cap container logs or the disk fills silently.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
