# Production stack for a single VPS.
#
#   1. Create the secret files once (they are gitignored):
#        mkdir -p secrets
#        openssl rand -hex 32 > secrets/jwt_secret
#        openssl rand -base64 24 > secrets/db_password
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the dev docker-compose.yml that matter:
#   - Postgres is NOT published to the host. Only caddy has published ports.
#   - Schema comes from committed migrations via the one-shot `migrate` service,
#     never from synchronize.
#   - Secrets are mounted as files, not passed as environment variables.
#   - Every service has a healthcheck and restart: unless-stopped.

name: aas-prod

# Caps container logs so the disk cannot fill silently. Declared BEFORE the
# services because a YAML alias can only reference an anchor that precedes it —
# the original version defined this at the bottom of the file and referenced it
# nowhere, so every service was silently running with unbounded json-file logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Mounted at /run/secrets/<name> in the services that list them. Not env vars, so
# they are absent from `docker inspect`, from /proc/<pid>/environ, from child
# processes, and from anything that dumps the environment on a crash.
#
# `file:` is the Compose-without-Swarm form. On Swarm or another orchestrator
# these become external secrets with no change to the services below.
secrets:
  db_password:
    file: /srv/all-about-saas/secrets/db_password
  jwt_secret:
    file: /srv/all-about-saas/secrets/jwt_secret
  minio_root_password:
    file: /srv/all-about-saas/secrets/minio_root_password
  base_password:
    file: /srv/all-about-saas/secrets/base_password
  google_client_secret:
    file: /srv/all-about-saas/secrets/google_client_secret
  github_client_secret:
    file: /srv/all-about-saas/secrets/github_client_secret
  facebook_client_secret:
    file: /srv/all-about-saas/secrets/facebook_client_secret

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      # The official image resolves *_FILE itself.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DATABASE_NAME}
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — the database is reachable only on the internal network.
    networks: [internal]
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Scheduled pg_dump into ./backups. A sidecar rather than the host cron the
  # backup script's header suggests, because a schedule that ships inside the
  # stack cannot be forgotten during provisioning — the cron approach exists
  # only if the operator remembers it.
  #
  # Same image as the server so pg_dump's major always matches. Writes to a
  # .part file and renames only after a size sanity check: a dump that died
  # mid-write must never be distinguishable-from-real, because the restore that
  # discovers it comes on the worst day.
  #
  # LOCAL-ONLY. A dump on the same disk as the database does not survive the
  # failure it exists for — scripts/backup-db.sh has the offsite hook
  # (BACKUP_REMOTE + rclone) and the --verify-latest restore test; run that from
  # host cron for the offsite leg, or sync ./backups by any other means.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USER}
      PGDATABASE: ${DATABASE_NAME}
      BACKUP_KEEP_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400
    secrets: [db_password]
    volumes:
      - ./backups:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        export PGPASSWORD="$$(tr -d '\r\n' < /run/secrets/db_password)"
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          out="/backups/$$PGDATABASE-$$stamp.dump"
          if pg_dump -Fc -f "$$out.part" && [ "$$(wc -c < "$$out.part")" -gt 1024 ]; then
            mv "$$out.part" "$$out"
            echo "backup: wrote $$out ($$(wc -c < "$$out") bytes)"
          else
            rm -f "$$out.part"
            echo "backup: FAILED at $$stamp" >&2
          fi
          find /backups -name '*.dump' -type f -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: [minio_root_password]
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket and makes it anonymously readable (GET only —
  # write still requires the root credentials). Runs once per deploy; mc
  # commands are idempotent so re-running on redeploy is harmless.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]
    secrets: [minio_root_password]
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        export MC_HOST_local="http://${MINIO_ROOT_USER}:$$(cat /run/secrets/minio_root_password)@minio:9000"
        mc mb -p local/aas-uploads
        mc anonymous set download local/aas-uploads
    restart: 'no'
  # One-shot: applies migrations, then exits. `depends_on: service_completed_successfully`
  # on the api means the app never starts against an un-migrated schema.
  migrate:
    image: aas-prod-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      FRONTEND_URL: ${FRONTEND_URL}
    secrets: [db_password, jwt_secret]
    command: ['npm', 'run', 'migration:run:prod']
    working_dir: /app/apps/api
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *default-logging

  api:
    image: aas-prod-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: lax
      BASE_PASSWORD_FILE: ${BASE_PASSWORD_FILE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET_FILE: ${GITHUB_CLIENT_SECRET_FILE}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET_FILE: ${FACEBOOK_CLIENT_SECRET_FILE}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: aas-uploads
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      DATABASE_SSL: ${DATABASE_SSL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
    secrets:
      [
        db_password,
        jwt_secret,
        minio_root_password,
        base_password,
        google_client_secret,
        github_client_secret,
        facebook_client_secret,
      ]
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: aas-prod-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    networks: [internal]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  minio_data:

networks:
  internal:
    driver: bridge
