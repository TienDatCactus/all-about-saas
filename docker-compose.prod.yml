# Production stack for a single VPS.
#
#   1. Create the secret files once (they are gitignored):
#        mkdir -p secrets
#        openssl rand -hex 32 > secrets/jwt_secret
#        openssl rand -base64 24 > secrets/db_password
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the dev docker-compose.yml that matter:
#   - Postgres is NOT published to the host. Only caddy has published ports.
#   - Schema comes from committed migrations via the one-shot `migrate` service,
#     never from synchronize.
#   - Secrets are mounted as files, not passed as environment variables.
#   - Every service has a healthcheck and restart: unless-stopped.

name: aas-prod

# Caps container logs so the disk cannot fill silently. Declared BEFORE the
# services because a YAML alias can only reference an anchor that precedes it —
# the original version defined this at the bottom of the file and referenced it
# nowhere, so every service was silently running with unbounded json-file logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - ${SECRETS_DIR:-/srv/all-about-saas/secrets}:/run/secrets:ro
    ports:
      - '127.0.0.1:9000:9000'
    networks:
      - internal
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.aas-minio.rule=Host(`twinfoundry.org`) && PathPrefix(`/storage`)"
      - "traefik.http.routers.aas-minio.entrypoints=https"
      - "traefik.http.routers.aas-minio.tls=true"
      - "traefik.http.routers.aas-minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aas-minio.priority=1000"
      - "traefik.http.routers.aas-minio.service=aas-minio"
      - "traefik.http.services.aas-minio.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.aas-minio-strip.stripprefix.prefixes=/storage"
      - "traefik.http.routers.aas-minio.middlewares=aas-minio-strip"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket and makes it anonymously readable (GET only —
  # write still requires the root credentials). Runs once per deploy; mc
  # commands are idempotent so re-running on redeploy is harmless.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]
    volumes:
      - ${SECRETS_DIR:-/srv/all-about-saas/secrets}:/run/secrets:ro
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        PASSWORD="$${MINIO_ROOT_PASSWORD:-}"
        if [ -z "$$PASSWORD" ] && [ -f /run/secrets/minio_root_password ]; then
          PASSWORD="$$(cat /run/secrets/minio_root_password)"
        fi
        export MC_HOST_local="http://${MINIO_ROOT_USER}:$${PASSWORD}@minio:9000"
        mc mb -p local/aas-uploads
        mc anonymous set download local/aas-uploads
    restart: 'no'

  # One-shot: applies migrations, then exits. `depends_on: service_completed_successfully`
  # on the api means the app never starts against an un-migrated schema.
  migrate:
    image: aas-prod-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_HOST: ${DATABASE_HOST:-mlazqpku9t4bmxc2fmrycvur}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-aas}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_PASSWORD_FILE: ${DATABASE_PASSWORD_FILE:-}
      DATABASE_NAME: ${DATABASE_NAME:-aas}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-/run/secrets/jwt_secret}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - ${SECRETS_DIR:-/srv/all-about-saas/secrets}:/run/secrets:ro
    command: ['npm', 'run', 'migration:run:prod']
    working_dir: /app/apps/api
    networks:
      - internal
      - coolify
    restart: 'no'
    logging: *default-logging

  api:
    image: aas-prod-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_HOST: ${DATABASE_HOST:-mlazqpku9t4bmxc2fmrycvur}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-aas}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_PASSWORD_FILE: ${DATABASE_PASSWORD_FILE:-}
      DATABASE_NAME: ${DATABASE_NAME:-aas}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-/run/secrets/jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: lax
      BASE_PASSWORD: ${BASE_PASSWORD}
      BASE_PASSWORD_FILE: ${BASE_PASSWORD_FILE:-/run/secrets/base_password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CLIENT_SECRET_FILE: ${GITHUB_CLIENT_SECRET_FILE}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      FACEBOOK_CLIENT_SECRET_FILE: ${FACEBOOK_CLIENT_SECRET_FILE}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: aas-uploads
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECRET_KEY_FILE: ${MINIO_SECRET_KEY_FILE:-/run/secrets/minio_root_password}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      - ${SECRETS_DIR:-/srv/all-about-saas/secrets}:/run/secrets:ro
    networks:
      - internal
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.aas-api.rule=Host(`twinfoundry.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.aas-api.entrypoints=https"
      - "traefik.http.routers.aas-api.tls=true"
      - "traefik.http.routers.aas-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aas-api.priority=1000"
      - "traefik.http.routers.aas-api.service=aas-api"
      - "traefik.http.services.aas-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.aas-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.aas-api.middlewares=aas-api-strip"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: aas-prod-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:8000
      INTERNAL_MINIO_URL: http://minio:9000
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - internal
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.aas-web.rule=Host(`twinfoundry.org`)"
      - "traefik.http.routers.aas-web.entrypoints=https"
      - "traefik.http.routers.aas-web.tls=true"
      - "traefik.http.routers.aas-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aas-web.priority=100"
      - "traefik.http.routers.aas-web.service=aas-web"
      - "traefik.http.services.aas-web.loadbalancer.server.port=3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  minio_data:

networks:
  internal:
    driver: bridge
  coolify:
    name: coolify
    external: true
