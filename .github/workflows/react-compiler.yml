name: React Compiler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  react-compiler:
    name: React Compiler Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: React Compiler Action
        uses: shubh73/react-compiler-action@v1.0.4
        with:
          token: ${{ github.token }}

          # Behavior
          changed-files-only: true
          fail-on-error: false
          compilation-mode: infer
          working-directory: .

          # PR feedback
          post-comment: true
          annotations: true
          annotation-level: warning

          # Files to analyze
          include-patterns: |
            apps/**/*.ts
            apps/**/*.tsx
            packages/**/*.ts
            packages/**/*.tsx

          # Files to ignore
          exclude-patterns: |
            **/node_modules/**
            **/dist/**
            **/.turbo/**
            **/.next/**
            **/coverage/**
            **/*.d.ts
            **/*.test.*
            **/*.spec.*
            **/__tests__/**
            **/generated/**
