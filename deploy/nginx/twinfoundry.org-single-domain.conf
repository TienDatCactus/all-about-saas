# nginx site for all-about-saas — SINGLE DOMAIN variant.
#
# Serves the web app at https://twinfoundry.org and the API under
# https://twinfoundry.org/api — one hostname, one certificate, one DNS record.
#
# Use this INSTEAD of twinfoundry.org.conf (which uses api.twinfoundry.org).
# Do not enable both; they claim the same server_name.
#
#   sudo cp deploy/nginx/aas-proxy.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/twinfoundry.org-single-domain.conf \
#           /etc/nginx/sites-available/twinfoundry.org
#   sudo ln -sf /etc/nginx/sites-available/twinfoundry.org /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot --nginx -d twinfoundry.org -d www.twinfoundry.org
#
# Matching config elsewhere:
#   .env.prod        VITE_API_BASE_URL=https://twinfoundry.org/api
#                    FRONTEND_URL=https://twinfoundry.org
#                    MINIO_PUBLIC_URL=https://twinfoundry.org/storage/aas-uploads
#                      (REQUIRED here — the compose default builds it from
#                       API_DOMAIN, which this variant does not have)
#   GitHub variables VITE_API_BASE_URL=https://twinfoundry.org/api
#                    PUBLIC_API_URL=twinfoundry.org/api
#                    PUBLIC_WEB_URL=twinfoundry.org
#
# This variant is not a compromise — for a single-VPS deployment it is the
# better shape:
#
#   - Same origin, so there is NO CORS. An entire class of "works locally,
#     blocked in production" failure disappears.
#   - The refresh cookie is same-site by construction; SameSite=None and its
#     third-party-cookie problems never arise.
#   - CSP tightens to connect-src 'self' — nothing external to allow.
#   - One certificate and one DNS record to keep alive instead of two.
#
# The trade-off: web and API can no longer be pointed at different hosts by
# changing DNS. Moving the API elsewhere later means editing this file rather
# than an A record.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: redirect to HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name twinfoundry.org www.twinfoundry.org;

    # certbot's HTTP-01 renewal must not be redirected, or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: web app + API under /api ----------------------------------------
server {
    # HTTP/2 as a `listen` parameter rather than the standalone `http2 on;`
    # directive. That directive only exists in nginx >= 1.25.1, and Ubuntu 22.04
    # ships 1.18 — where it fails the config outright with
    # `unknown directive "http2"`. The parameter form works on every version;
    # newer builds mark it deprecated but still honour it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twinfoundry.org www.twinfoundry.org;

    ssl_certificate     /etc/letsencrypt/live/twinfoundry.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinfoundry.org/privkey.pem;
    # Protocol versions, ciphers, session cache. Without this include, selection
    # falls back to nginx defaults, which on older builds still negotiate TLSv1.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    # The API caps JSON bodies at 100kb itself; this is the outer bound.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # connect-src is just 'self' here — the API shares this origin, so there is
    # no external host to allow. Strictly tighter than the two-domain variant:
    # an injected script has no permitted destination at all.
    #
    # img-src stays at 'self' too, and that is deliberate rather than an
    # oversight: uploaded QR images are served from /storage/aas-uploads/ on THIS
    # host (see the location below), so they are already same-origin. The
    # two-domain variant has to name https://api.twinfoundry.org there because
    # its /storage/ lives on another hostname. The matching requirement is that
    # MINIO_PUBLIC_URL be set to https://twinfoundry.org/storage/aas-uploads for
    # this variant — the compose default builds it from API_DOMAIN, which this
    # layout does not have.
    #
    # 'unsafe-inline' stays in script-src because the SSR framework hydrates via
    # inline scripts; removing it breaks every page load. The upgrade path is
    # nonce-based CSP at the framework level, not deleting the keyword here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- API ---------------------------------------------------------------
    # nginx matches the LONGEST prefix, so this wins over `location /` no matter
    # what order the blocks appear in.
    #
    # The trailing slash on proxy_pass is what strips the /api prefix:
    #   /api/auth/login  ->  http://127.0.0.1:8000/auth/login
    # Remove that slash and the API would receive /api/auth/login and 404 every
    # request, since it declares no global prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        include /etc/nginx/snippets/aas-proxy.conf;

        # The API scopes its OAuth cookies (oauth_state, oauth_return_to) to
        # Path=/auth — see oauth-state.ts — but under this variant the browser
        # sees those routes as /api/auth/*. Cookie paths are matched against
        # the BROWSER-visible path, so without this rewrite the provider's
        # redirect to /api/auth/<p>/callback arrives without the state cookie
        # and every OAuth login fails with "Invalid OAuth state".
        # refresh_token has Path=/ and is unaffected.
        proxy_cookie_path /auth /api/auth;
    }

    # `/api` with no trailing slash would otherwise fall through to the web app
    # and render its 404 page, which is a confusing thing to get from an API.
    location = /api {
        return 301 /api/;
    }

    # --- Uploaded QR images (MinIO) -----------------------------------------
    # NOT under /api/ — MINIO_PUBLIC_URL points a participant's browser straight
    # at /storage/aas-uploads/..., and MinIO is a separate service from the API,
    # so routing it through the /api/ block would send the request to Nest and
    # 404. There was no /storage/ location here at all: every share-page QR image
    # fell through to the web app and rendered as a broken image.
    #
    # Longest-prefix wins, so this beats `location /` regardless of block order.
    #
    # Scoped to the one bucket rather than all of /storage/ — the bucket name is
    # fixed in docker-compose.prod.yml, and a broader prefix would expose any
    # other bucket that ever gets created.
    #
    # 127.0.0.1:9000, not `minio:9000`: nginx runs on the HOST, where docker
    # service names do not resolve. The compose file publishes MinIO's S3 port on
    # loopback for this (MINIO_HOST_PORT, default 9000), the same way it publishes
    # the api on 8000 and the web app on 3000.
    #
    # The trailing slash on proxy_pass swaps the matched /storage/aas-uploads/
    # prefix for /aas-uploads/, which is the path-style key MinIO serves:
    #   /storage/aas-uploads/momo-qr/<id>  ->  /aas-uploads/momo-qr/<id>
    location /storage/aas-uploads/ {
        proxy_pass http://127.0.0.1:9000/aas-uploads/;
        include /etc/nginx/snippets/aas-proxy.conf;
    }

    # --- Web app -----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aas-proxy.conf;
    }
}
