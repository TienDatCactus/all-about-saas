# nginx site for all-about-saas — replaces /etc/nginx/sites-enabled/twinfoundry.org
#
#   sudo cp deploy/nginx/twinfoundry.org.conf /etc/nginx/sites-available/twinfoundry.org
#   sudo ln -sf /etc/nginx/sites-available/twinfoundry.org /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # see note 1
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the compose stack publishes on loopback only:
#   web  -> 127.0.0.1:3000
#   api  -> 127.0.0.1:8000
#
# The API needs its own hostname and its own certificate:
#   sudo certbot --nginx -d twinfoundry.org -d www.twinfoundry.org -d api.twinfoundry.org
# (DNS for api.twinfoundry.org must already point here or ACME validation fails.)

# WebSocket upgrades. The previous config sent `Connection: upgrade` on EVERY
# request, including ordinary ones — this map sends `close` unless the client
# actually asked to upgrade, which is what keeps keepalive working.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: redirect everything, both hosts -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name twinfoundry.org www.twinfoundry.org api.twinfoundry.org;

    # Leave a path for certbot's HTTP-01 renewals; redirecting it breaks renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: web app ----------------------------------------------------------
server {
    # HTTP/2 as a `listen` parameter rather than the standalone `http2 on;`
    # directive. That directive only exists in nginx >= 1.25.1, and Ubuntu 22.04
    # ships 1.18 — where it fails the config outright with
    # `unknown directive "http2"`. The parameter form works on every version;
    # newer builds mark it deprecated but still honour it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twinfoundry.org www.twinfoundry.org;

    ssl_certificate     /etc/letsencrypt/live/twinfoundry.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinfoundry.org/privkey.pem;
    # Protocol versions, ciphers and session cache. Without this include the
    # server falls back to nginx defaults, which on older builds still negotiate
    # TLSv1/1.1. certbot installs this file.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Defense-in-depth for the access token, which now lives in JS memory rather
    # than localStorage: connect-src pins fetch/XHR to this origin and the API,
    # so an injected script has nowhere to send it even if injection succeeds.
    #
    # 'unsafe-inline' stays in script-src because the SSR framework hydrates via
    # inline scripts — removing it breaks every page load. The upgrade path is
    # nonce-based CSP at the framework level, not deleting the keyword here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.twinfoundry.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aas-proxy.conf;
    }
}

# --- HTTPS: API --------------------------------------------------------------
server {
    # HTTP/2 as a `listen` parameter rather than the standalone `http2 on;`
    # directive. That directive only exists in nginx >= 1.25.1, and Ubuntu 22.04
    # ships 1.18 — where it fails the config outright with
    # `unknown directive "http2"`. The parameter form works on every version;
    # newer builds mark it deprecated but still honour it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.twinfoundry.org;

    ssl_certificate     /etc/letsencrypt/live/twinfoundry.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinfoundry.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    # The API caps JSON bodies at 100kb itself; this is the outer bound.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # No CORS headers here on purpose. The API sets them itself from
    # FRONTEND_URL, and a second Access-Control-Allow-Origin from nginx would
    # make browsers reject the response for having two.

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/aas-proxy.conf;
    }
}

# NOTE 1 — the packaged `default` site (example.com) is still enabled. It has no
# `default_server` marker, so whichever block nginx loads first answers unmatched
# Host headers; leaving it in place makes that order matter. Disable it.
#
# NOTE 2 — the certificate above covers api.twinfoundry.org only if you passed
# `-d api.twinfoundry.org` to certbot. If you issued a separate cert for the API,
# point the two ssl_* lines in this block at /etc/letsencrypt/live/api.twinfoundry.org/.
