# Shared proxy headers. Install as /etc/nginx/snippets/aas-proxy.conf
#
#   sudo cp deploy/nginx/aas-proxy.conf /etc/nginx/snippets/aas-proxy.conf
#
# The X-Forwarded-* headers below are NOT optional for this API.
#
# main.ts sets `app.set('trust proxy', 1)`, which tells Express to read the
# client address from the rightmost X-Forwarded-For entry. The previous config
# never sent that header, so Express saw only the proxy and `req.ip` was
# 127.0.0.1 on every single request. Three things break silently that way:
#
#   1. The rate limiter keys on req.ip. One shared key means the 5/min login
#      limit applies to the entire internet collectively — the first five login
#      attempts from anyone lock out everybody else for the minute, while doing
#      nothing at all against a distributed attacker.
#   2. Session.ipAddress records 127.0.0.1 for every login, so the session list
#      a user sees ("where am I signed in?") is worthless.
#   3. req.protocol reads http behind TLS, which affects any absolute URL the
#      app builds and any secure-cookie logic that checks it.
#
# `trust proxy: 1` trusts exactly one hop — the rightmost entry, appended by
# this nginx — so a client that forges its own X-Forwarded-For cannot spoof the
# source IP. That guarantee only holds while exactly one proxy sits in front. If
# you later put Cloudflare or a load balancer ahead of nginx, the hop count must
# change to match, or the rate limiter starts trusting a client-supplied value.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / SSE upgrades. $connection_upgrade comes from the map in the site
# config and is `close` for ordinary requests.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_cache_bypass $http_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
